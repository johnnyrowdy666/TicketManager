<svg viewBox="0 0 1200 3000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mockup-text { font-family: 'Sarabun', system-ui, sans-serif; }
      .heading-1 { font-size: 24px; font-weight: 600; fill: #0f172a; }
      .heading-2 { font-size: 20px; font-weight: 600; fill: #0f172a; }
      .heading-3 { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .body-text { font-size: 16px; font-weight: 400; fill: #475569; }
      .body-sm { font-size: 14px; font-weight: 400; fill: #64748b; }
      .caption { font-size: 12px; font-weight: 500; fill: #94a3b8; text-transform: uppercase; }
      .btn-primary { fill: #2563eb; }
      .btn-text { fill: #ffffff; font-size: 14px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .nav-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .input-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .shadow { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1)); }
    </style>
  </defs>

  <!-- Desktop Home Page Mockup -->
  <g id="desktop-home">
    <text x="20" y="30" class="mockup-text caption">DESKTOP - HOME PAGE (1200px)</text>
    
    <!-- Navigation -->
    <rect x="20" y="50" width="1160" height="80" class="nav-bg shadow"/>
    <text x="40" y="85" class="mockup-text heading-2">TicketManager</text>
    
    <!-- Search Bar -->
    <rect x="300" y="70" width="400" height="40" class="input-bg" rx="8"/>
    <text x="320" y="93" class="mockup-text body-sm">ค้นหาอีเวนต์...</text>
    <rect x="720" y="70" width="80" height="40" class="btn-primary" rx="8"/>
    <text x="750" y="93" class="mockup-text btn-text">ค้นหา</text>
    
    <!-- User Menu -->
    <text x="1000" y="93" class="mockup-text body-text">สวัสดี, ผู้ใช้</text>
    <rect x="1100" y="70" width="60" height="40" class="btn-primary" rx="8"/>
    <text x="1120" y="93" class="mockup-text btn-text">เมนู</text>

    <!-- Main Content -->
    <text x="40" y="180" class="mockup-text heading-1">รายการอีเวนต์</text>
    
    <!-- Event Grid -->
    <g id="event-grid">
      <!-- Event Card 1 -->
      <rect x="40" y="220" width="280" height="320" class="card-bg shadow" rx="12"/>
      <rect x="40" y="220" width="280" height="160" fill="#f1f5f9" rx="12 12 0 0"/>
      <text x="160" y="310" class="mockup-text body-sm" text-anchor="middle">Event Image</text>
      <text x="60" y="410" class="mockup-text heading-3">คอนเสิร์ตดนตรี</text>
      <text x="60" y="435" class="mockup-text body-sm">15 มี.ค. 2024 • ศูนย์การค้า</text>
      <text x="60" y="455" class="mockup-text body-text">฿1,500</text>
      <rect x="60" y="470" width="120" height="36" class="btn-primary" rx="8"/>
      <text x="120" y="492" class="mockup-text btn-text" text-anchor="middle">ดูรายละเอียด</text>

      <!-- Event Card 2 -->
      <rect x="340" y="220" width="280" height="320" class="card-bg shadow" rx="12"/>
      <rect x="340" y="220" width="280" height="160" fill="#f1f5f9" rx="12 12 0 0"/>
      <text x="480" y="310" class="mockup-text body-sm" text-anchor="middle">Event Image</text>
      <text x="360" y="410" class="mockup-text heading-3">งานแสดงศิลปะ</text>
      <text x="360" y="435" class="mockup-text body-sm">20 มี.ค. 2024 • หอศิลป์</text>
      <text x="360" y="455" class="mockup-text body-text">฿800</text>
      <rect x="360" y="470" width="120" height="36" class="btn-primary" rx="8"/>
      <text x="420" y="492" class="mockup-text btn-text" text-anchor="middle">ดูรายละเอียด</text>

      <!-- Event Card 3 -->
      <rect x="640" y="220" width="280" height="320" class="card-bg shadow" rx="12"/>
      <rect x="640" y="220" width="280" height="160" fill="#f1f5f9" rx="12 12 0 0"/>
      <text x="780" y="310" class="mockup-text body-sm" text-anchor="middle">Event Image</text>
      <text x="660" y="410" class="mockup-text heading-3">เทศกาลอาหาร</text>
      <text x="660" y="435" class="mockup-text body-sm">25 มี.ค. 2024 • สวนสาธารณะ</text>
      <text x="660" y="455" class="mockup-text body-text">ฟรี</text>
      <rect x="660" y="470" width="120" height="36" class="btn-primary" rx="8"/>
      <text x="720" y="492" class="mockup-text btn-text" text-anchor="middle">ดูรายละเอียด</text>

      <!-- Event Card 4 -->
      <rect x="940" y="220" width="280" height="320" class="card-bg shadow" rx="12"/>
      <rect x="940" y="220" width="280" height="160" fill="#f1f5f9" rx="12 12 0 0"/>
      <text x="1080" y="310" class="mockup-text body-sm" text-anchor="middle">Event Image</text>
      <text x="960" y="410" class="mockup-text heading-3">การประชุมธุรกิจ</text>
      <text x="960" y="435" class="mockup-text body-sm">30 มี.ค. 2024 • โรงแรม</text>
      <text x="960" y="455" class="mockup-text body-text">฿2,500</text>
      <rect x="960" y="470" width="120" height="36" class="btn-primary" rx="8"/>
      <text x="1020" y="492" class="mockup-text btn-text" text-anchor="middle">ดูรายละเอียด</text>
    </g>
  </g>

  <!-- Mobile Home Page Mockup -->
  <g id="mobile-home" transform="translate(0, 600)">
    <text x="20" y="30" class="mockup-text caption">MOBILE - HOME PAGE (375px)</text>
    
    <!-- Mobile Navigation -->
    <rect x="20" y="50" width="375" height="70" class="nav-bg shadow"/>
    <text x="40" y="80" class="mockup-text heading-3">TicketManager</text>
    <rect x="320" y="65" width="60" height="30" class="btn-primary" rx="6"/>
    <text x="340" y="83" class="mockup-text" font-size="12" fill="white">เมนู</text>
    
    <!-- Mobile Search -->
    <rect x="40" y="140" width="280" height="40" class="input-bg" rx="8"/>
    <text x="60" y="163" class="mockup-text body-sm">ค้นหาอีเวนต์...</text>
    <rect x="330" y="140" width="60" height="40" class="btn-primary" rx="8"/>
    <text x="350" y="163" class="mockup-text" font-size="12" fill="white">ค้นหา</text>

    <!-- Mobile Content -->
    <text x="40" y="220" class="mockup-text heading-2">รายการอีเวนต์</text>
    
    <!-- Mobile Event Cards -->
    <rect x="40" y="240" width="335" height="280" class="card-bg shadow" rx="12"/>
    <rect x="40" y="240" width="335" height="140" fill="#f1f5f9" rx="12 12 0 0"/>
    <text x="207" y="320" class="mockup-text body-sm" text-anchor="middle">Event Image</text>
    <text x="60" y="405" class="mockup-text heading-3">คอนเสิร์ตดนตรี</text>
    <text x="60" y="425" class="mockup-text body-sm">15 มี.ค. 2024 • ศูนย์การค้า</text>
    <text x="60" y="445" class="mockup-text body-text">฿1,500</text>
    <rect x="60" y="460" width="120" height="36" class="btn-primary" rx="8"/>
    <text x="120" y="482" class="mockup-text btn-text" text-anchor="middle">ดูรายละเอียด</text>

    <rect x="40" y="540" width="335" height="280" class="card-bg shadow" rx="12"/>
    <rect x="40" y="540" width="335" height="140" fill="#f1f5f9" rx="12 12 0 0"/>
    <text x="207" y="620" class="mockup-text body-sm" text-anchor="middle">Event Image</text>
    <text x="60" y="705" class="mockup-text heading-3">งานแสดงศิลปะ</text>
    <text x="60" y="725" class="mockup-text body-sm">20 มี.ค. 2024 • หอศิลป์</text>
    <text x="60" y="745" class="mockup-text body-text">฿800</text>
    <rect x="60" y="760" width="120" height="36" class="btn-primary" rx="8"/>
    <text x="120" y="782" class="mockup-text btn-text" text-anchor="middle">ดูรายละเอียด</text>
  </g>

  <!-- Event Detail Page Mockup -->
  <g id="event-detail" transform="translate(0, 1400)">
    <text x="20" y="30" class="mockup-text caption">DESKTOP - EVENT DETAIL PAGE</text>
    
    <!-- Navigation -->
    <rect x="20" y="50" width="1160" height="80" class="nav-bg shadow"/>
    <text x="40" y="85" class="mockup-text heading-2">TicketManager</text>
    
    <!-- Hero Image -->
    <rect x="40" y="160" width="1120" height="400" fill="#f1f5f9" class="shadow" rx="12"/>
    <text x="600" y="370" class="mockup-text heading-1" text-anchor="middle">Event Hero Image</text>
    
    <!-- Event Details -->
    <text x="40" y="620" class="mockup-text heading-1">คอนเสิร์ตดนตรีใหญ่ประจำปี 2024</text>
    <text x="40" y="660" class="mockup-text body-text">วันที่: 15 มีนาคม 2024 • สถานที่: ศูนย์การค้าใหญ่</text>
    <text x="40" y="690" class="mockup-text body-text">ราคา: ฿1,500</text>
    
    <text x="40" y="730" class="mockup-text heading-3">รายละเอียดงาน</text>
    <text x="40" y="760" class="mockup-text body-text">คอนเสิร์ตดนตรีสุดพิเศษที่รวบรวมศิลปินชั้นนำมาแสดงในงานเดียว</text>
    <text x="40" y="780" class="mockup-text body-text">พร้อมด้วยเทคโนโลยีเสียงและแสงสีที่ทันสมัย</text>
    
    <!-- Action Buttons -->
    <rect x="40" y="820" width="150" height="48" class="btn-primary shadow" rx="8"/>
    <text x="115" y="848" class="mockup-text btn-text" text-anchor="middle">ซื้อตั๋ว</text>
    
    <rect x="210" y="820" width="150" height="48" fill="transparent" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="285" y="848" class="mockup-text" fill="#2563eb" text-anchor="middle">เปิดแผนที่</text>
    
    <rect x="380" y="820" width="150" height="48" fill="transparent" stroke="#64748b" stroke-width="1" rx="8"/>
    <text x="455" y="848" class="mockup-text" fill="#64748b" text-anchor="middle">แชร์</text>
  </g>

  <!-- Login Page Mockup -->
  <g id="login-page" transform="translate(0, 2200)">
    <text x="20" y="30" class="mockup-text caption">DESKTOP - LOGIN PAGE</text>
    
    <!-- Navigation -->
    <rect x="20" y="50" width="1160" height="80" class="nav-bg shadow"/>
    <text x="40" y="85" class="mockup-text heading-2">TicketManager</text>
    
    <!-- Login Form -->
    <rect x="440" y="200" width="320" height="400" class="card-bg shadow" rx="12"/>
    <text x="600" y="240" class="mockup-text heading-2" text-anchor="middle">เข้าสู่ระบบ</text>
    
    <!-- Email Field -->
    <text x="470" y="290" class="mockup-text body-sm">อีเมล</text>
    <rect x="470" y="300" width="260" height="40" class="input-bg" rx="8"/>
    <text x="485" y="323" class="mockup-text body-text">user@example.com</text>
    
    <!-- Password Field -->
    <text x="470" y="370" class="mockup-text body-sm">รหัสผ่าน</text>
    <rect x="470" y="380" width="260" height="40" class="input-bg" rx="8"/>
    <text x="485" y="403" class="mockup-text body-text">••••••••</text>
    
    <!-- Login Button -->
    <rect x="470" y="450" width="260" height="48" class="btn-primary shadow" rx="8"/>
    <text x="600" y="478" class="mockup-text btn-text" text-anchor="middle">เข้าสู่ระบบ</text>
    
    <!-- Register Link -->
    <text x="600" y="540" class="mockup-text body-sm" text-anchor="middle">ยังไม่มีบัญชี? </text>
    <text x="600" y="560" class="mockup-text body-sm" text-anchor="middle" fill="#2563eb">สมัครสมาชิก</text>
  </g>

  <!-- Responsive Breakpoints Indicator -->
  <g id="breakpoints" transform="translate(0, 2800)">
    <text x="20" y="30" class="mockup-text caption">RESPONSIVE BREAKPOINTS</text>
    
    <rect x="20" y="50" width="320" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="8"/>
    <text x="180" y="75" class="mockup-text body-text" text-anchor="middle">Mobile</text>
    <text x="180" y="95" class="mockup-text body-sm" text-anchor="middle">320px - 639px</text>
    
    <rect x="360" y="50" width="200" height="60" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8"/>
    <text x="460" y="75" class="mockup-text body-text" text-anchor="middle">Tablet</text>
    <text x="460" y="95" class="mockup-text body-sm" text-anchor="middle">640px - 1023px</text>
    
    <rect x="580" y="50" width="200" height="60" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
    <text x="680" y="75" class="mockup-text body-text" text-anchor="middle">Desktop</text>
    <text x="680" y="95" class="mockup-text body-sm" text-anchor="middle">1024px+</text>
  </g>
</svg>